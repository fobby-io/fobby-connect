<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fobby Rosetta</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1c1c1a; --muted: #6a6964; --line: #dedbd3; --soft: #f8f7f4;
    --accent: #1d5c87; --accent-ink: #ffffff; --warn: #a34a12; --warn-bg: #fdf1e7; --warn-line: #f1c9a8;
    --ok: #2b6e39; --ok-bg: #eaf5ed; --edit-bg: #fff4c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --ink: #ebeae6; --muted: #a2a19b; --line: #383733; --soft: #252522;
      --accent: #74b3df; --accent-ink: #0d1b26; --warn: #f2a06a; --warn-bg: #352314; --warn-line: #6b4321;
      --ok: #85cf94; --ok-bg: #1a2f1f; --edit-bg: #4b4114; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  .steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
  .steps li { padding: 4px 12px; border-radius: 99px; color: var(--muted); font-size: 14px; }
  .steps li.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .steps li.done { color: var(--ok); }
  header .new { margin-left: auto; }

  .wrap { max-width: 1500px; margin: 0 auto; padding: 20px 24px 120px; }
  .drop { max-width: 640px; margin: 60px auto; text-align: center; background: var(--panel); border: 2px dashed var(--line); border-radius: 12px; padding: 48px 32px; }
  .drop.over { border-color: var(--accent); }
  .drop h2 { margin: 0 0 8px; font-size: 20px; }
  .drop p { color: var(--muted); margin: 0 0 20px; }
  .drop input { display: none; }
  .busy { max-width: 640px; margin: 80px auto; text-align: center; color: var(--muted); }
  .busy strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }

  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  .summary h2 { margin: 0 0 4px; font-size: 18px; }
  .summary p { margin: 0; color: var(--muted); }
  .todo { margin-top: 14px; border-radius: 10px; padding: 12px 16px; background: var(--warn-bg); border: 1px solid var(--warn-line); }
  .todo.clear { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .todo h3 { margin: 0 0 6px; font-size: 15px; color: var(--warn); }
  .todo ol { margin: 0; padding-left: 20px; }
  .todo li { margin: 4px 0; }
  .todo li button.link { margin-left: 6px; }

  .review { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .review { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .viewer { position: sticky; top: 12px; }
  .pages { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .pages button { padding: 4px 12px; font-size: 14px; }
  .pages button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .page { position: relative; }
  .page img { width: 100%; display: block; border-radius: 4px; border: 1px solid var(--line); background: #fff; }
  .box { position: absolute; border: 2px solid var(--accent); border-radius: 3px; background: color-mix(in srgb, var(--accent) 14%, transparent); pointer-events: none; display: none; }
  .box.on { display: block; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

  h3.sec { font-size: 15px; margin: 0 0 8px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; padding: 8px 10px; background: var(--soft); border-bottom: 1px solid var(--line); vertical-align: bottom; white-space: nowrap; font-weight: 600; }
  th .printed { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  th.warn, td.warn { box-shadow: inset 0 3px 0 var(--warn); }
  td.warn { box-shadow: none; background: color-mix(in srgb, var(--warn-bg) 70%, transparent); }
  td { border-bottom: 1px solid var(--line); padding: 0; vertical-align: top; }
  tr.group td { background: var(--soft); color: var(--muted); font-size: 13px; padding: 6px 10px; white-space: pre-line; }
  tr.item:hover td, tr.item.on td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .cell { width: 100%; min-width: 72px; border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; font: inherit; background: transparent; color: var(--ink); resize: none; field-sizing: content; }
  .cell:hover { border-color: var(--line); }
  .cell:focus { border-color: var(--accent); outline: none; background: var(--panel); }
  .cell.edited { background: var(--edit-bg); }
  td.desc .cell { min-width: 220px; font-size: 13px; }
  .was { display: block; padding: 0 8px 4px; font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .colfix { display: block; margin-top: 2px; font-weight: 400; font-size: 12px; }
  .colfix select { font: inherit; font-size: 12px; }

  .totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
  .totals label { font-size: 13px; color: var(--muted); }
  .totals .cell { border-color: var(--line); }
  .totals .warn .cell { border-color: var(--warn); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; z-index: 5; }
  .bar .who { display: flex; gap: 8px; align-items: center; }
  .bar input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 220px; }
  .bar .count { color: var(--muted); }
  .bar .go { margin-left: auto; }

  .learned { margin-top: 16px; }
  .result { border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .result.good { background: var(--ok-bg); }
  .result.neutral { background: var(--panel); border: 1px solid var(--line); }
  .result.warn { background: var(--warn-bg); }
  .result h2 { margin: 0 0 6px; font-size: 18px; }
  .result p { margin: 4px 0; }
  .result ul { margin: 8px 0 0; padding-left: 20px; }
  .muted { color: var(--muted); }
  .history { list-style: none; padding: 0; margin: 0; }
  .history li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); margin-left: 6px; }
  .tag.on { background: var(--ok-bg); color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Fobby Rosetta</h1>
  <ol class="steps" id="steps"><li>1 上傳文件</li><li>2 檢查與修正</li><li>3 確認並學習</li></ol>
  <button class="new" id="new" hidden>讀下一份文件</button>
</header>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.includes("-") ? e.setAttribute(k, v) : (e[k] = v);
  e.append(...kids.filter((k) => k != null && k !== false));
  return e;
};

// Plain names for the schema's fields; the printed label from the page is shown under each.
const FIELD = {
  pkg_range: "箱號", marks: "嘜頭", description: "品名／說明", part_no: "料號", lot_no: "批號", hs_code: "稅則號",
  po_no: "PO 號碼", pkg_qty: "箱數", pkg_unit: "包裝單位", qty: "數量", qty_unit: "數量單位", qty_per_pkg: "每箱數量",
  nw_kg: "淨重", gw_kg: "毛重", nw_per_pkg_kg: "每箱淨重", gw_per_pkg_kg: "每箱毛重", cbm: "材積",
};
const TOTAL = { total_pkgs: "總箱數", total_pallets: "總板數", total_qty: "總數量", total_gw_kg: "總毛重", total_nw_kg: "總淨重", total_cbm: "總材積", total_gw_with_pallets_kg: "含棧板毛重", total_pkgs_in_words: "大寫總箱數" };
const CHECK_FIELD = { total_pkgs: "pkg_qty", total_qty: "qty", total_gw_kg: "gw_kg", total_nw_kg: "nw_kg", total_cbm: "cbm" };
const DOC_TYPE = { PL: "裝箱單（Packing List）", SO: "託運單（Shipping Order）" };

let doc = null, answer = null, current = 0;

function steps(n) {
  [...$("#steps").children].forEach((li, i) => { li.className = i + 1 === n ? "on" : i + 1 < n ? "done" : ""; });
  $("#new").hidden = n === 1;
}
$("#new").onclick = () => { history.replaceState(null, "", "/"); doc = null; showUpload(); };

// ---------- Step 1 ----------
function showUpload() {
  steps(1);
  $("#bar").hidden = true;
  const input = el("input", { type: "file", accept: "application/pdf", id: "file" });
  const pick = el("button", { className: "primary", textContent: "選擇 PDF", onclick: () => input.click() });
  const box = el("div", { className: "drop" },
    el("h2", { textContent: "上傳一份裝箱單或託運單" }),
    el("p", { textContent: "系統會讀出每一列、自動核對加總，只把需要你確認的地方標出來。掃描檔也可以。" }),
    pick, input, el("p", { className: "hint", textContent: "或把 PDF 拖進這個框" }));
  input.onchange = () => input.files[0] && upload(input.files[0]);
  box.ondragover = (e) => { e.preventDefault(); box.classList.add("over"); };
  box.ondragleave = () => box.classList.remove("over");
  box.ondrop = (e) => { e.preventDefault(); box.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(f); };
  $("#app").replaceChildren(box);
}

async function upload(f) {
  $("#app").replaceChildren(el("div", { className: "busy" }, el("strong", { textContent: `正在讀取 ${f.name}…` }), "每頁約 5–15 秒。讀完會自動核對加總。"));
  const r = await fetch(`/api/documents?${new URLSearchParams({ name: f.name })}`, { method: "POST", body: f });
  const j = await r.json();
  if (!r.ok) return $("#app").replaceChildren(el("div", { className: "busy" }, el("strong", { textContent: "讀取失敗" }), j.error.message));
  history.replaceState(null, "", `#${j.id}`);
  start(j);
}

function start(j) {
  doc = j; answer = structuredClone(j.run.pages.map((p) => p.output)); current = 0;
  j.approved ? showResult() : showReview();
}

// ---------- Step 2 ----------
const original = (p, r, c) => doc.run.pages[p].output.rows[r]?.cells[c] ?? null;
function edits() {
  let n = 0;
  answer.forEach((p, pi) => {
    p.rows.forEach((r, ri) => r.cells.forEach((v, ci) => { if ((v || null) !== original(pi, ri, ci)) n++; }));
    p.columns.forEach((c, ci) => { if (c.field !== doc.run.pages[pi].output.columns[ci]?.field) n++; });
    Object.entries(p.totals).forEach(([k, v]) => { if (v && v.v !== doc.run.pages[pi].output.totals[k]?.v) n++; });
  });
  return n;
}

function problems() {
  // The server lists a failed check once per page it involves; show it once.
  const byMsg = Map.groupBy(doc.run.findings, (f) => f.message);
  return [...byMsg].map(([, list]) => {
    const f = list[0];
    const key = f.path.split(".")[1];
    const m = f.message.match(/rows add up to ([\d.]+) \w+, the totals line says (.+)$/);
    const text = m ? `${TOTAL[key] ?? key}對不上：每列加起來是 ${m[1]}，合計列印的是 ${m[2]}` : f.message.replace(/container number (\S+) fails the ISO 6346 check digit/, "貨櫃號碼 $1 的檢查碼不對");
    return { text, field: CHECK_FIELD[key], total: key, pages: list.map((x) => x.page) };
  });
}

function sourceLine() {
  const p = doc.run.prompt;
  if (p?.level === "sender") return `這家已經學過，用它專屬的讀法（第 ${p.version} 版）。`;
  return `這家第一次出現，用${p?.level === "class" ? `${doc.run.cls} 的通用讀法` : "最基本的讀法"}。你確認後，系統會記住這家的格式。`;
}

function showReview() {
  steps(2);
  const run = doc.run;
  const issuer = (run.issuer ?? "").split("\n")[0] || "（沒讀到寄件公司）";
  const rows = run.pages.reduce((n, p) => n + p.output.rows.filter((r) => r.t === "item" || r.t === "ditto").length, 0);
  const probs = problems();
  const warnFields = new Set(probs.map((p) => p.field).filter(Boolean));
  const warnTotals = new Set(probs.map((p) => p.total));

  const todo = probs.length
    ? el("div", { className: "todo" }, el("h3", { textContent: `需要你確認 ${probs.length} 處` }),
        el("ol", {}, ...probs.map((p) => el("li", {}, p.text, "。請對照原頁檢查標橘色的欄位。",
          el("button", { className: "link", textContent: `看第 ${p.pages[0]} 頁`, onclick: () => { current = p.pages[0] - 1; showReview(); } })))),
        el("p", { className: "hint", textContent: "有時是讀錯一個數字，有時是合計本身就含棧板重量。改正表格裡的值；如果原本就對，直接確認即可。" }))
    : el("div", { className: "todo clear", textContent: "自動核對全部通過：每列加總和合計列一致。快速看過一遍沒問題就可以確認。" });

  const summary = el("section", { className: "summary" },
    el("h2", { textContent: `${issuer} 的${DOC_TYPE[run.cls] ?? "文件"}` }),
    el("p", { textContent: `共 ${run.pages.length} 頁，讀出 ${rows} 列。${sourceLine()}` }), todo);

  // Page image, with the row being edited outlined.
  const pg = run.pages[current];
  const page = el("div", { className: "page" }, el("img", { src: `/api/documents/${doc.id}/pages/${pg.page_no}.png`, alt: `原文件第 ${pg.page_no} 頁` }));
  const out = answer[current];
  const boxes = out.rows.map((r) => {
    const [x0, y0, x1, y1] = r.box;
    const b = el("div", { className: "box" });
    Object.assign(b.style, { left: `${x0 / 10}%`, top: `${y0 / 10}%`, width: `${(x1 - x0) / 10}%`, height: `${(y1 - y0) / 10}%` });
    page.append(b);
    return b;
  });
  const pageTabs = run.pages.length > 1 ? el("div", { className: "pages" }, ...run.pages.map((p, i) =>
    el("button", { className: i === current ? "on" : "", textContent: `第 ${p.page_no} 頁`, onclick: () => { current = i; showReview(); } }))) : null;
  const viewer = el("section", { className: "card viewer" }, pageTabs, page, el("p", { className: "hint", textContent: "點右邊任一列，原頁上會框出它的位置。" }));

  // Table: plain column names, printed label below, cells edit in place.
  const head = el("tr", {}, ...out.columns.map((c, ci) => {
    const origField = doc.run.pages[current].output.columns[ci]?.field;
    const sel = el("select", { "aria-label": `${c.label} 這一欄是` }, ...Object.entries(FIELD).map(([f, n]) => el("option", { value: f, textContent: n, selected: f === c.field })));
    sel.onchange = () => { c.field = sel.value; showReview(); };
    const fix = el("span", { className: "colfix" });
    const open = el("button", { className: "link", textContent: c.field !== origField ? "已改欄位" : "欄位不對？", onclick: () => fix.replaceChildren("這一欄是 ", sel) });
    fix.append(open);
    return el("th", { className: warnFields.has(c.field) ? "warn" : "" }, FIELD[c.field] ?? c.field, el("span", { className: "printed", textContent: `原文：${c.label.replace(/\n/g, " ")}` }), fix);
  }));
  const body = [];
  out.rows.forEach((r, ri) => {
    if (r.t !== "item" && r.t !== "ditto") {
      body.push(el("tr", { className: "group" }, el("td", { colSpan: out.columns.length, textContent: r.cells.filter(Boolean).join("　") })));
      return;
    }
    const tr = el("tr", { className: "item" });
    r.cells.forEach((v, ci) => {
      const field = out.columns[ci]?.field;
      const was = original(current, ri, ci);
      const ta = el("textarea", { className: "cell", value: v ?? "", rows: 1, "aria-label": `${FIELD[field] ?? field}，第 ${ri + 1} 列` });
      const wasEl = el("span", { className: "was" });
      const mark = () => {
        const changed = (ta.value || null) !== was;
        ta.classList.toggle("edited", changed);
        wasEl.textContent = changed ? `原本讀到：${was ?? "（空白）"}` : "";
      };
      ta.oninput = () => { r.cells[ci] = ta.value === "" ? null : ta.value; mark(); updateBar(); };
      ta.onfocus = () => { boxes.forEach((b, i) => b.classList.toggle("on", i === ri)); tr.parentElement.querySelectorAll("tr").forEach((x) => x.classList.remove("on")); tr.classList.add("on"); };
      mark();
      tr.append(el("td", { className: `${field === "description" || field === "marks" ? "desc" : ""} ${warnFields.has(field) ? "warn" : ""}` }, ta, wasEl));
    });
    body.push(tr);
  });
  const table = el("div", { className: "table-wrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...body)));

  const totals = Object.entries(out.totals).filter(([, v]) => v);
  const totalsBox = totals.length ? el("div", { className: "totals" }, ...totals.map(([k, v]) => {
    const orig = doc.run.pages[current].output.totals[k]?.v ?? null;
    const ta = el("textarea", { className: "cell", value: v.v, rows: 1, id: `t-${k}` });
    const mark = () => ta.classList.toggle("edited", ta.value !== orig);
    ta.oninput = () => { v.v = ta.value; mark(); updateBar(); };
    mark();
    return el("div", { className: warnTotals.has(k) ? "warn" : "" }, el("label", { htmlFor: `t-${k}`, textContent: TOTAL[k] ?? k }), ta);
  })) : null;

  const data = el("section", { className: "card" },
    el("h3", { className: "sec", textContent: `第 ${pg.page_no} 頁的明細` }), table,
    totalsBox ? el("h3", { className: "sec", style: "margin-top:16px", textContent: "合計列" }) : null, totalsBox);

  $("#app").replaceChildren(summary, el("div", { className: "review" }, viewer, data));
  showBar(issuer);
}

// ---------- Step 3 ----------
let senderInput = null;
function showBar(issuer) {
  const bar = $("#bar");
  senderInput = el("input", { type: "text", id: "sender", value: doc.run.sender ?? issuer.replace(/\b(CO|CORP|INC|LTD|LIMITED|ENTERPRISE)\b\.?|[.,]/gi, "").trim() });
  bar.replaceChildren(
    el("div", { className: "who" }, el("label", { htmlFor: "sender", textContent: "寄件公司" }), senderInput),
    el("span", { className: "count", id: "count" }),
    el("button", { className: "primary go", id: "go", onclick: approve }));
  bar.hidden = false;
  updateBar();
}
function updateBar() {
  const n = edits();
  $("#count").textContent = n ? `你改了 ${n} 處` : "還沒有修改";
  $("#go").textContent = n ? "確認修正，讓系統學起來" : "全部正確，確認";
}

async function approve() {
  if (!senderInput.value.trim()) return senderInput.focus();
  const n = edits();
  steps(3);
  $("#bar").hidden = true;
  $("#app").replaceChildren(el("div", { className: "busy" },
    el("strong", { textContent: n ? "正在學習你的修正…" : "存檔中…" }),
    n ? "系統會寫一版新的讀法，並用它重讀這家以前確認過的文件，確定沒有變差才會採用。約 30 秒到 2 分鐘。" : ""));
  const r = await fetch(`/api/documents/${doc.id}/approve`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sender: senderInput.value, answer }) });
  const j = await r.json();
  if (!r.ok) { $("#app").replaceChildren(el("div", { className: "busy" }, el("strong", { textContent: "沒有存成功" }), j.error.message)); return; }
  doc.approved = { sender: senderInput.value.trim().toUpperCase(), learn: j.learn, corrected: j.corrected };
  showResult();
}

async function showResult() {
  steps(3);
  $("#bar").hidden = true;
  const a = doc.approved, l = a.learn;
  let card;
  if (l.outcome === "no_change") {
    card = el("div", { className: "result neutral" }, el("h2", { textContent: "已確認存檔" }), el("p", { textContent: "這份沒有需要修改的地方，這家的讀法維持不變。" }));
  } else if (l.outcome === "activated") {
    const v = l.version, before = l.scores.current.reduce((x, y) => x + y, 0), after = l.scores.candidate.reduce((x, y) => x + y, 0);
    card = el("div", { className: "result good" },
      el("h2", { textContent: `已學會 ${a.sender} 的格式` }),
      el("p", { textContent: `你改了 ${a.corrected} 處。系統寫了新的讀法（第 ${v.version} 版），用它重讀這家已確認的 ${l.scores.candidate.length} 份文件：需要修改的地方從 ${before} 處變成 ${after} 處。` }),
      el("p", { textContent: `下次收到 ${a.sender} 的${DOC_TYPE[doc.run.cls] ?? "文件"}，會自動用這版讀。` }),
      v.notes.length ? el("ul", {}, ...v.notes.map((x) => el("li", { textContent: x }))) : el("p", { className: "muted", textContent: "這次學到的是這家的欄位排列，並把這份存成範例。" }));
  } else {
    card = el("div", { className: "result warn" },
      el("h2", { textContent: "這次的修正系統學不會" }),
      el("p", { textContent: `你改了 ${a.corrected} 處，但試了 ${l.tries} 種新寫法，都沒有讓這家的文件讀得更好，所以維持原本的讀法。` }),
      el("p", { textContent: `以後這家的這些欄位會固定請你確認：${l.always_review.map((p) => FIELD[p.split(".").pop()] ?? TOTAL[p.split(".").pop()] ?? p).join("、")}。` }));
  }
  const hist = el("ul", { className: "history" });
  $("#app").replaceChildren(card, el("section", { className: "card learned" }, el("h3", { className: "sec", textContent: "系統記住的各家讀法" }), hist));
  const h = await (await fetch("/api/profiles")).json();
  if (!h.length) return hist.replaceChildren(el("li", { className: "muted", textContent: "還沒有。確認一份有修正的文件後，這裡會出現那家的讀法。" }));
  hist.replaceChildren(...h.flatMap((s) => s.versions.slice().reverse().map((v) => el("li", {},
    el("strong", { textContent: `${s.sender}・${DOC_TYPE[v.key.split("/")[1]] ?? v.key.split("/")[1]}・第 ${v.version} 版` }),
    el("span", { className: `tag ${v.status === "active" ? "on" : ""}`, textContent: v.status === "active" ? "使用中" : v.status === "retired" ? "已停用" : "候選" }),
    v.notes.length ? el("ul", {}, ...v.notes.map((x) => el("li", { className: "muted", textContent: x }))) : null))));
}

// #<id> reopens a document already read, so a review survives a reload.
(async () => {
  if (location.hash.length > 1) {
    const r = await fetch(`/api/documents/${location.hash.slice(1)}`);
    if (r.ok) return start(await r.json());
  }
  showUpload();
})();
</script>
</body>
</html>
